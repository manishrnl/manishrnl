<svg width="1000" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090412"/>
      <stop offset="30%" stop-color="#1F0B2B"/>
      <stop offset="70%" stop-color="#2E0D48"/>
      <stop offset="100%" stop-color="#12081E"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 35) rotate(90) scale(150 250)">
      <stop stop-color="#F9C88A" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#F9C88A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 170) rotate(90) scale(170 260)">
      <stop stop-color="#E9A6FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E9A6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F4E8FF"/>
      <stop offset="100%" stop-color="#D9C7FF"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCE7B2"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7D7FF"/>
    </linearGradient>
    <filter id="blurSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1000" height="220" rx="26" fill="url(#bg)"/>
